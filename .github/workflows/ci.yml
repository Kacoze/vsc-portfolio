name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run coverage

  e2e:
    name: E2E tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: [typecheck, lint, unit]
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      - if: matrix.project == 'chromium'
        run: npx playwright test --project=chromium --grep-invert "Lighthouse"
      - if: matrix.project == 'mobile'
        run: npx playwright test tests/e2e/mobile.spec.ts --project=mobile
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse 100/100
    runs-on: ubuntu-latest
    needs: [typecheck, lint, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright test --project=chromium --grep "Lighthouse"
        env:
          CHROME_PATH: /usr/bin/google-chrome-stable
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lighthouse-report
          path: playwright-report/
          retention-days: 7
